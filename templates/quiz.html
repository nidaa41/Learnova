<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Generator – Learnova</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link rel="stylesheet" href="/static/css/quiz.css">
    <script src="/static/js/theme.js"></script>
</head>
<body class="quiz-body">

    <!-- Icons -->
    <svg style="display:none">
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
        <symbol id="i-quiz" viewBox="0 0 24 24"><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/><path d="M8 11l3 3 9-9"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
        <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></symbol>
    </svg>

    <!-- Header -->
    <header class="page-header">
        <a href="/dashboard" class="back-link">
            <svg class="ic"><use href="#i-back"/></svg> Dashboard
        </a>
        <div class="page-title">
            <div class="icon-box sm icon-quiz"><svg class="ic"><use href="#i-quiz"/></svg></div>
            <div>
                <h1>Quiz Generator</h1>
                <span>Test yourself on any topic</span>
            </div>
        </div>
        <button id="themeToggle" class="theme-switch" aria-label="Toggle dark mode">
            <span class="theme-switch-thumb">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </span>
        </button>
    </header>

    <main class="quiz-container">

        <!-- ===== 1. Setup ===== -->
        <section class="quiz-screen active" id="setupScreen">
            <div class="quiz-card">
                <h2 class="card-title">Create a new quiz</h2>

                <div class="mode-tabs">
                    <button class="mode-tab active" data-mode="topic">Topic</button>
                    <button class="mode-tab" data-mode="notes">My notes</button>
                </div>

                <div class="mode-panel" id="topicPanel">
                    <label for="topicInput">What do you want to be tested on?</label>
                    <input type="text" id="topicInput" maxlength="200"
                           placeholder="e.g. SQL joins, Photosynthesis, OS process scheduling">
                </div>

                <div class="mode-panel hidden" id="notesPanel">
                    <label for="notesInput">Paste your notes</label>
                    <textarea id="notesInput" rows="8" maxlength="15000"
                              placeholder="Paste at least a paragraph of notes. Nova will only ask about what's in them."></textarea>
                    <span class="char-count" id="charCount">0 / 15,000</span>
                </div>

                <div class="option-row">
                    <div>
                        <label>Number of questions</label>
                        <div class="pill-group" id="countGroup">
                            <button class="pill" data-value="5">5</button>
                            <button class="pill active" data-value="10">10</button>
                            <button class="pill" data-value="15">15</button>
                        </div>
                    </div>
                    <div>
                        <label>Difficulty</label>
                        <div class="pill-group" id="difficultyGroup">
                            <button class="pill" data-value="easy">Easy</button>
                            <button class="pill active" data-value="medium">Medium</button>
                            <button class="pill" data-value="hard">Hard</button>
                        </div>
                    </div>
                </div>

                <p class="error-msg" id="setupError"></p>
                <button class="btn btn-primary btn-full" id="generateBtn">Generate Quiz</button>
            </div>

            <div class="quiz-card">
                <h3 class="card-title small">Recent quizzes</h3>
                <div id="recentList"><p class="muted">No quizzes yet. Your results will show up here.</p></div>
            </div>
        </section>

        <!-- ===== 2. Loading ===== -->
        <section class="quiz-screen" id="loadingScreen">
            <div class="loading-box">
                <div class="loader">
                    <div class="loader-ring"></div>
                    <svg class="ic"><use href="#i-quiz"/></svg>
                </div>
                <h2>Nova is writing your quiz...</h2>
                <p id="loadingText">Reading the topic</p>
            </div>
        </section>

        <!-- ===== 3. Questions ===== -->
        <section class="quiz-screen" id="questionScreen">
            <div class="quiz-top">
                <span class="quiz-topic" id="quizTopic"></span>
                <span class="quiz-counter" id="quizCounter"></span>
            </div>
            <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

            <div class="quiz-card question-card">
                <h2 id="questionText"></h2>
                <div class="options" id="options"></div>
                <div class="explanation hidden" id="explanation"></div>
                <button class="btn btn-primary btn-full hidden" id="nextBtn">Next question</button>
            </div>

            <p class="live-score">Score: <strong id="liveScore">0</strong></p>
        </section>

        <!-- ===== 4. Results ===== -->
        <section class="quiz-screen" id="resultScreen">
            <div class="quiz-card result-card">
                <div class="ring">
                    <svg viewBox="0 0 120 120">
                        <circle class="ring-bg" cx="60" cy="60" r="52"/>
                        <circle class="ring-fg" id="resultRing" cx="60" cy="60" r="52"/>
                    </svg>
                    <div class="ring-text">
                        <strong id="resultPercent">0%</strong>
                        <span id="resultScore">0 / 0</span>
                    </div>
                </div>
                <h2 id="resultTitle"></h2>
                <p id="resultText"></p>
                <div class="result-actions">
                    <button class="btn btn-outline" id="retryBtn">Retry this quiz</button>
                    <button class="btn btn-primary" id="newQuizBtn">New quiz</button>
                </div>
            </div>

            <div class="quiz-card">
                <h3 class="card-title small">Review your answers</h3>
                <div id="reviewList"></div>
            </div>
        </section>

    </main>

    <script src="/static/js/quiz.js"></script>
</body>
</html>
