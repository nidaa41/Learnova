<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Nova – Learnova</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link rel="stylesheet" href="/static/css/chat.css">
    <script src="/static/js/theme.js"></script>
</head>
<body class="chat-body">

    <!-- Icons -->
    <svg style="display:none">
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
        <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></symbol>
        <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V5"/><circle cx="12" cy="3.5" r="1.5"/><path d="M9 13h.01M15 13h.01M9.5 16.5h5" stroke-width="2.4"/><path d="M2 13v2M22 13v2"/></symbol>
    </svg>

    <!-- Chat history sidebar -->
    <aside class="chat-sidebar" id="chatSidebar">
        <a href="/dashboard" class="back-link">
            <svg class="ic"><use href="#i-back"/></svg> Dashboard
        </a>

        <button class="new-chat-btn" id="newChatBtn">
            <svg class="ic"><use href="#i-plus"/></svg> New chat
        </button>

        <p class="side-label">Recent chats</p>
        <div class="chat-list" id="chatList">
            <p class="chat-list-empty">No chats yet</p>
        </div>
    </aside>

    <div class="sidebar-overlay" id="chatOverlay"></div>

    <!-- Main chat area -->
    <main class="chat-main">
        <header class="chat-header">
            <button class="icon-btn chat-menu-btn" id="chatMenuBtn" aria-label="Open chats">
                <svg class="ic"><use href="#i-menu"/></svg>
            </button>

            <div class="bot-avatar">🤖</div>
            <div class="chat-title">
                <h1>Nova</h1>
                <span><span class="online-dot"></span> AI Study Buddy · Online</span>
            </div>

            <button id="themeToggle" class="theme-switch" aria-label="Toggle dark mode">
                <span class="theme-switch-thumb">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                </span>
            </button>
        </header>

        <div class="chat-window" id="chatWindow">
            <!-- Shown when a chat is empty -->
            <div class="chat-empty" id="chatEmpty">
                <div class="bot-avatar big">🤖</div>
                <h2>Hi {{ name.split()[0] }}, I'm Nova</h2>
                <p>Ask me any study question. I can explain concepts, solve doubts and help you revise.</p>

                <div class="starter-grid">
                    <button class="starter">Explain recursion with a simple example</button>
                    <button class="starter">What is the difference between TCP and UDP?</button>
                    <button class="starter">Summarize the causes of World War I</button>
                    <button class="starter">How should I prepare for exams in 3 days?</button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages"></div>
        </div>

        <form class="chat-input" id="chatForm">
            <textarea id="chatInput" rows="1" placeholder="Message Nova..." maxlength="4000"></textarea>
            <button type="submit" id="sendBtn" aria-label="Send">
                <svg class="ic"><use href="#i-send"/></svg>
            </button>
        </form>
        <p class="chat-note">Nova can make mistakes. Double-check important information.</p>
    </main>

    <script src="/static/js/chat.js"></script>
    <script src="/static/js/study-timer.js"></script>
</body>
</html>
